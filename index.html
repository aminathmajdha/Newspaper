html[lang=dv] body{font-family:'Samee Avas','Faruma','Noto Sans Thaana','MV Faseyha',sans-serif}
html[lang=dv] h1,html[lang=dv] h2,html[lang=dv] h3,html[lang=dv] h4,html[lang=dv] .logo span{font-family:'MV Eamaan XP','Faruma','Noto Sans Thaana',sans-serif;font-weight:400}
a{color:inherit;text-decoration:none}
img{display:block;width:100%;height:100%;object-fit:cover}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
/* header */
header{background:linear-gradient(90deg,var(--navy),var(--red));color:#fff;position:sticky;top:0;z-index:20}
.bar{display:flex;align-items:center;gap:20px;height:72px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.5rem}
.logo img{width:auto;height:56px;background:#fff;border-radius:8px;padding:3px 10px;object-fit:contain}
.logo i{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;font-style:normal;font-size:1.3rem}
nav{display:flex;gap:22px;flex:1;margin-inline-start:20px;overflow-x:auto;white-space:nowrap}
nav a{padding:6px 2px;border-bottom:2px solid transparent;font-size:1.05rem}
nav a:hover,nav a.on{border-color:#fff}
.tools{display:flex;gap:10px;align-items:center}
.tools button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:20px;padding:5px 14px;cursor:pointer;font:inherit;font-size:.9rem}
.tools button:hover{background:#fff;color:var(--red)}
.sub{background:#fff;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.sub .wrap{display:flex;justify-content:space-between;align-items:center;height:40px;gap:12px}
.sub form{display:flex}
.sub input{border:1px solid var(--line);border-radius:4px;padding:3px 10px;font:inherit;width:180px}
/* ad */
.ad{margin:18px auto;border-radius:6px;min-height:110px;display:grid;place-items:center;text-align:center;color:#fff;font-family:'Roboto',sans-serif;background:linear-gradient(90deg,#4b5563,#0f766e);padding:14px}
.ad b{font-size:2rem;letter-spacing:1px}
.ad small{display:block;opacity:.85}
/* hero */
.top{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-bottom:24px}
.hero{background:var(--card);border-radius:8px;overflow:hidden;display:grid;grid-template-columns:1.2fr 1fr}
.hero .img{min-height:340px}
.hero .txt{padding:28px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.tag{font-size:.85rem;color:var(--red);border-inline-start:3px solid var(--red);padding-inline-start:8px;width:max-content}
.hero h1{font-size:1.9rem;line-height:1.7}
.hero p{color:var(--muted)}
.time{font-size:.8rem;color:var(--muted);font-family:'Roboto',sans-serif}
.side{background:var(--card);border-radius:8px;padding:0 16px 8px}
.side h3,.sec h2{font-size:1.15rem;color:var(--red);padding:14px 0 10px}
.item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.item .th{flex:0 0 76px;height:58px;border-radius:4px;overflow:hidden}
.item h4{font-size:.98rem;line-height:1.6;font-weight:400}
.item:hover h4,.card:hover h4{color:var(--red)}
/* grid */
.sec{margin-bottom:30px}
.sec h2{border-bottom:2px solid var(--red);margin-bottom:16px;display:flex;justify-content:space-between}
.sec h2 a{font-size:.85rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:transparent}
.card .th{height:170px;border-radius:6px;overflow:hidden;margin-bottom:8px}
.card .time{text-align:center}
.card h4{text-align:center;font-weight:400;font-size:1.05rem;margin-top:4px;line-height:1.7}
footer{background:#2b3236;color:#ccc;margin-top:40px;padding:32px 0;font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}
footer b{color:#fff;font-size:1.2rem}
@media(max-width:900px){.top{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero .img{min-height:220px}.grid{grid-template-columns:repeat(2,1fr)}.bar{flex-wrap:wrap;height:auto;padding:10px 0}nav{order:3;flex-basis:100%;margin:0}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.sub input{width:110px}}
</style>
</head>
